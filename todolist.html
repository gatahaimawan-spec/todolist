<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

    <title>One5 TO-DO-LIST</title>
</head>

<body>




    <div class="navbar">
        <h1>One5 To-Do-List</h1>

        <input type="checkbox" id="check" />

        <label for="check" class="checkbtn"><i class="fa-solid fa-bars"></i></label>

        <div class="navbar-menu">
            <ul>
                <li>
                    <a href="todolist.html" id="arrow"><i class="fa-solid fa-arrow-left"></i><span>Back</span></a>
                </li>
                <li>
                    <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
                </li>
            </ul>
        </div>

        <div class="overlay"></div>
    </div>
    <div class="container-main">
        <div class="main-content">
            <div class="bg-input">
                <div class="input-section">
                    <input type="text" id="todo-input" placeholder="Add a new task..." />
                    <button id="task-btn"><i class="fa-solid fa-plus"></i></button>

                </div>
                <div id="task-list">
                    <ul id="task-list-ul">

                    </ul>
                </div>
                <div class="btnhps">
                    <button id="btn-hapus"><i class="fa-solid fa-trash-can"></i>Clear All</button>
                </div>
            </div>
        </div>
    </div>




    <script src="script.js"></script>

</body>

</html>
